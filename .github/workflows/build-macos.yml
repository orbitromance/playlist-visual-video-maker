name: Build macOS Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: Apple-Silicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build PLAYWAVE app
        shell: bash
        env:
          RUNNER_ARCH: ${{ matrix.arch }}
        run: bash ./build_macos.sh

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: PlayWave-macOS-${{ matrix.arch }}
          path: dist/PlayWave-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
