name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build portable Windows app
        shell: pwsh
        run: ./build_windows.ps1

      - name: Verify packaged executables
        shell: pwsh
        run: |
          $App = "dist\PlayWave"
          if (-not (Test-Path "$App\PlayWave.exe")) { throw "Main EXE missing" }
          $Ffmpeg = Get-ChildItem $App -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $Ffprobe = Get-ChildItem $App -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $Ffmpeg -or -not $Ffprobe) { throw "Bundled FFmpeg executables missing" }
          & $Ffmpeg.FullName -version | Select-Object -First 1
          & $Ffprobe.FullName -version | Select-Object -First 1

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: PlayWave-Windows
          path: dist/PlayWave/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
